<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GenoTranslate - Data Entry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100">

  <div class="container mx-auto p-8 max-w-2xl mt-10">
    <h1 class="text-3xl font-bold text-center mb-6">GenoTranslate - Simple Data Entry</h1>

    <form id="entry-form" class="bg-white p-8 rounded-lg shadow-md space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="term-select" class="block text-sm font-medium text-gray-700">Term</label>
          <select id="term-select" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></select>
        </div>
        <div>
          <label for="lang-select" class="block text-sm font-medium text-gray-700">Language</label>
          <select id="lang-select" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Level</label>
        <div id="audience-level-btns" class="flex flex-wrap gap-2 rounded-lg"></div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Length</label>
        <div id="explanation-length-btns" class="flex flex-wrap gap-2 rounded-lg"></div>
      </div>

      <div>
        <label for="explanation" class="block text-sm font-medium text-gray-700">Explanation</label>
        <textarea id="explanation" rows="4" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2"></textarea>
      </div>

      <div class="text-right">
        <button type="submit" class="inline-flex justify-center py-2 px-4 text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
          Save to Database
        </button>
      </div>
    </form>

    <div id="response-message" class="mt-6 text-center font-medium"></div>

    <div class="mt-10 bg-gray-800 p-6 rounded-lg shadow-md">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-white">Live Database Output (JSON)</h2>
        <button id="refresh-btn" class="px-4 py-2 text-sm font-semibold bg-gray-600 text-white rounded-md hover:bg-gray-500">Refresh Data</button>
      </div>
      <textarea id="json-output" readonly class="w-full h-96 bg-gray-900 text-green-300 font-mono text-sm p-4 rounded-lg border border-gray-700 focus:outline-none"></textarea>
    </div>
  </div>

  <script>
    const geneticTerms = ['Chromosome', 'Gene', 'Mutation', 'Allele', 'DNA', 'RNA', 'CRISPR', 'Genotype', 'Phenotype', 'Recessive Trait', 'Dominant Trait', 'Genetic Engineering', 'Meiosis', 'Mitosis'];
    const languages = ['German', 'Spanish', 'French', 'Japanese', 'Hindi', 'English'];
    const audienceLevels = [ { id: 'Low', label: 'Low' }, { id: 'Medium', label: 'Medium' }, { id: 'High', label: 'High' }];
    const explanationLengths = [ { id: 'Short', label: 'Short' }, { id: 'Detailed', label: 'Detailed' }];

    let currentLevel = 'Low';
    let currentLength = 'Short';

    const form = document.getElementById('entry-form');
    const responseMessage = document.getElementById('response-message');
    const termSelect = document.getElementById('term-select');
    const langSelect = document.getElementById('lang-select');
    const audienceLevelBtnsContainer = document.getElementById('audience-level-btns');
    const explanationLengthBtnsContainer = document.getElementById('explanation-length-btns');
    const jsonOutput = document.getElementById('json-output');
    const refreshBtn = document.getElementById('refresh-btn');

    function populateDropdown(selectElement, options) {
      options.forEach(option => selectElement.add(new Option(option, option)));
    }

    function createButtons(container, items, stateUpdater, initialState) {
      container.innerHTML = '';
      items.forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = item.label;
        button.className = `px-4 py-2 text-sm font-semibold rounded-md transition-all ${initialState === item.id ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
        button.onclick = () => {
          stateUpdater(item.id);
          container.querySelectorAll('button').forEach(btn => {
            btn.className = `px-4 py-2 text-sm font-semibold rounded-md transition-all ${btn === button ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
          });
        };
        container.appendChild(button);
      });
    }

    async function fetchAndShowJSON() {
      try {
        const res = await fetch("/api/entries");
        const data = await res.json();
        jsonOutput.value = JSON.stringify(data, null, 4);
      } catch (err) {
        jsonOutput.value = "Error fetching data: " + err.message;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const entryData = {
        term: termSelect.value,
        language: langSelect.value,
        level: currentLevel,
        length: currentLength,
        explanation: document.getElementById('explanation').value,
      };

      try {
        const res = await fetch("/api/add-entry", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(entryData)
        });

        const result = await res.json();
        if (res.ok) {
          responseMessage.textContent = "✅ " + result.message;
          responseMessage.style.color = "green";
          form.reset();
          createButtons(audienceLevelBtnsContainer, audienceLevels, id => currentLevel = id, "Low");
          createButtons(explanationLengthBtnsContainer, explanationLengths, id => currentLength = id, "Short");
          fetchAndShowJSON();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        responseMessage.textContent = "❌ Error: " + err.message;
        responseMessage.style.color = "red";
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      populateDropdown(termSelect, geneticTerms);
      populateDropdown(langSelect, languages);
      createButtons(audienceLevelBtnsContainer, audienceLevels, id => currentLevel = id, "Low");
      createButtons(explanationLengthBtnsContainer, explanationLengths, id => currentLength = id, "Short");
      fetchAndShowJSON();
      refreshBtn.addEventListener('click', fetchAndShowJSON);
    });
  </script>
</body>
</html>
